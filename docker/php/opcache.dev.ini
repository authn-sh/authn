; Dev override for /usr/local/etc/php/conf.d/zz-authn.ini's strict OPcache.
; Production builds set validate_timestamps=0 for max throughput; dev needs
; OPcache to re-stat changed files so bind-mounted edits take effect without
; restarting php-fpm. Mounted via docker-compose.dev.yml — production never
; sees this file.
opcache.validate_timestamps=1
opcache.revalidate_freq=0
