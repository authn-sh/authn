# Dev override — auto-merged by `docker compose up`. Switches the app
# container to the `dev` Dockerfile target (composer dev deps + node_modules)
# and selectively mounts source so HMR works without clobbering the image's
# storage / bootstrap-cache permissions (which are baked for UID 82
# www-data and would otherwise be re-owned by the host UID).

services:
  app:
    build:
      target: dev
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      MAIL_MAILER: smtp
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
    volumes:
      # Source directories worth HMR-ing during dev. Storage, bootstrap/cache,
      # vendor, node_modules, public/build stay owned by the image so the
      # container user can write to them.
      - ./app:/var/www/html/app
      - ./bootstrap/app.php:/var/www/html/bootstrap/app.php
      - ./bootstrap/providers.php:/var/www/html/bootstrap/providers.php
      - ./config:/var/www/html/config
      - ./database:/var/www/html/database
      - ./resources:/var/www/html/resources
      - ./routes:/var/www/html/routes
      - ./tests:/var/www/html/tests
      - ./public/index.php:/var/www/html/public/index.php
      - ./.env:/var/www/html/.env
    command: ["composer", "run", "dev"]
    ports:
      - "8000:8000"        # `php artisan serve`
      - "5173:5173"        # Vite HMR
      - "8080:8080"        # nginx (also rebound, so the prod path keeps working)

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "8025:8025"        # Mailpit UI
      - "1025:1025"        # SMTP listener
