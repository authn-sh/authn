# Dev override — auto-merged by `docker compose up`.
#
# Same shape as production (app + worker + scheduler all running nginx+fpm
# resp. queue:work / schedule:work) but switched to the `dev` Dockerfile
# target so composer dev deps + node_modules are present, with selective
# source bind-mounts so HMR works without clobbering image perms.
#
# Vite runs in its own container against the same source mount so the
# Account Portal / Dashboard assets reload without a host Node toolchain.

x-dev: &dev-base
  build:
    target: dev
  environment:
    APP_ENV: local
    APP_DEBUG: "true"
    MAIL_MAILER: smtp
    MAIL_HOST: mailpit
    MAIL_PORT: 1025
  volumes:
    # Source dirs worth HMR-ing. Storage, bootstrap/cache, vendor,
    # node_modules, public/build stay owned by the image so the container
    # user (uid 82) can write to them.
    - ./app:/var/www/html/app
    - ./bootstrap/app.php:/var/www/html/bootstrap/app.php
    - ./bootstrap/providers.php:/var/www/html/bootstrap/providers.php
    - ./config:/var/www/html/config
    - ./database:/var/www/html/database
    - ./resources:/var/www/html/resources
    - ./routes:/var/www/html/routes
    - ./tests:/var/www/html/tests
    - ./public/index.php:/var/www/html/public/index.php
    - ./.env:/var/www/html/.env

services:
  app:
    <<: *dev-base
    # nginx + php-fpm via supervisord (the production CMD); no
    # `php artisan serve`. Dev exercises the same routing + FPM pool the
    # release image uses.

  worker:
    <<: *dev-base

  scheduler:
    <<: *dev-base

  vite:
    image: node:20-alpine
    working_dir: /var/www/html
    command:
      - sh
      - -c
      - npm install --no-audit --no-fund && npm run dev -- --host 0.0.0.0
    volumes:
      - .:/var/www/html
      - vite_node_modules:/var/www/html/node_modules
    ports:
      - "5173:5173"
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "8025:8025"        # Mailpit UI
      - "1025:1025"        # SMTP listener

volumes:
  vite_node_modules:
