name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      APP_ENV: testing
      APP_KEY: base64:dGVzdHRlc3R0ZXN0dGVzdHRlc3R0ZXN0dGVzdHRlc3Q=
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: authn
      DB_USERNAME: authn
      DB_PASSWORD: authn
      REDIS_CLIENT: phpredis
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: authn
          POSTGRES_PASSWORD: authn
          POSTGRES_DB: authn
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U authn"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: pdo_pgsql, redis, intl, bcmath, gd, sodium
          coverage: none
          tools: composer:v2

      - name: Cache composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - run: composer install --prefer-dist --no-interaction --no-progress

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Bundle size budget (Account Portal initial JS ≤ 200 KB gzipped)
        run: npm run size

      - name: Pint (style)
        run: vendor/bin/pint --test

      - name: Migrate against PostgreSQL
        run: php artisan migrate --force

      - name: Pest (in-memory SQLite per phpunit.xml)
        run: php artisan test --parallel

  dusk:
    runs-on: ubuntu-latest
    needs: test
    env:
      APP_KEY: base64:dGVzdHRlc3R0ZXN0dGVzdHRlc3R0ZXN0dGVzdHRlc3Q=
      AUTHN_BOOTSTRAP_ADMIN_EMAIL: op@example.com
      AUTHN_BOOTSTRAP_ADMIN_PASSWORD: super-secret-password
      AUTHN_BOOTSTRAP_WORKSPACE_NAME: Acme Inc
      DUSK_OPERATOR_EMAIL: op@example.com
      DUSK_OPERATOR_PASSWORD: super-secret-password

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: pdo_pgsql, redis, intl, bcmath, gd, sodium
          coverage: none
          tools: composer:v2

      - run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare .env
        run: |
          cp .env.example .env
          sed -i "s|^APP_KEY=.*|APP_KEY=${APP_KEY}|" .env

      - name: Set up Docker buildx
        uses: docker/setup-buildx-action@v3

      - name: Build dev image (cached)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: dev
          load: true
          tags: |
            authn-app:latest
            authn-worker:latest
            authn-scheduler:latest
          cache-from: type=gha,scope=dusk
          cache-to: type=gha,mode=max,scope=dusk

      - name: Boot stack
        run: docker compose -f docker-compose.yml -f docker-compose.dev.yml -f docker-compose.dusk.yml up -d

      - name: Wait for app
        run: |
          for i in $(seq 1 60); do
            curl -sf http://localhost:8080/up >/dev/null && exit 0
            sleep 2
          done
          echo "app never came up"; exit 1

      - name: Bootstrap operator
        run: |
          docker compose -f docker-compose.yml -f docker-compose.dev.yml -f docker-compose.dusk.yml exec -T \
            -e AUTHN_BOOTSTRAP_ADMIN_EMAIL=${DUSK_OPERATOR_EMAIL} \
            -e AUTHN_BOOTSTRAP_ADMIN_PASSWORD=${DUSK_OPERATOR_PASSWORD} \
            app php artisan authn:bootstrap

      - name: Run Dusk smoke suite
        run: make dusk

      - name: Upload Dusk artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dusk-artifacts
          path: |
            tests/Browser/screenshots
            tests/Browser/console
            tests/Browser/source

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.dev.yml -f docker-compose.dusk.yml down -v

  docker:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker buildx
        uses: docker/setup-buildx-action@v3

      - name: Build runtime image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          load: true
          tags: authn/authn:pr-${{ github.event.pull_request.number || github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy scan (HIGH/CRITICAL on our layers)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: authn/authn:pr-${{ github.event.pull_request.number || github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          vuln-type: library
          format: table
