# authn.sh — production-shaped baseline. `docker compose up -d` builds the
# image from this repo's Dockerfile (so self-hosters always know what they're
# running). The released image (`ghcr.io/authn-sh/authn:<tag>`) is what the
# Helm chart pulls — the compose stack does not depend on it.
#
# Dev workflow lives in the opt-in `docker-compose.dev.yml` layer:
#   make dev                                            # convenience
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up
#
# Self-hosters can drop a local `docker-compose.override.yml` (gitignored)
# for their own customizations; compose auto-merges it.
#
# Three application services share one image:
#
#   app        nginx + php-fpm; runs migrations + authn:bootstrap on boot.
#   worker     `php artisan queue:work …`; scale with
#              `docker compose up -d --scale worker=N`.
#   scheduler  `php artisan schedule:work`; singleton.

x-app-base: &app-base
  build:
    context: .
    target: runtime
  environment:
    DB_HOST: postgres
    DB_PORT: 5432
    REDIS_HOST: redis
    REDIS_PORT: 6379
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    app:
      condition: service_healthy
  restart: unless-stopped

services:
  app:
    build:
      context: .
      target: runtime
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      AUTHN_RUN_MIGRATIONS: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${AUTHN_HTTP_PORT:-8080}:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--silent", "--fail", "http://127.0.0.1:8080/up"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  worker:
    <<: *app-base
    command:
      - php
      - artisan
      - queue:work
      - --queue=default,webhooks,mail
      - --tries=3
      - --sleep=1
      - --backoff=10
    healthcheck:
      # `queue:listen --once` style probe — exits 0 when redis + db respond.
      test: ["CMD", "php", "/var/www/html/artisan", "queue:monitor", "default"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  scheduler:
    <<: *app-base
    command:
      - php
      - artisan
      - schedule:work

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USERNAME:-authn}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-authn}
      POSTGRES_DB: ${DB_DATABASE:-authn}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${DB_USERNAME:-authn}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  pgdata:
  redisdata:
